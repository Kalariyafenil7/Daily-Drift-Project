<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Drift – Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to right, #f3fce9, #fff6da);
        }

        /* ================= NAVBAR ================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: #2ecc71;
        }

        .logo span {
            margin-left: 8px;
        }

        .nav-links a {
            margin: 0 12px;
            text-decoration: none;
            color: #555;
            font-weight: 500;
        }

        .nav-links .btn {
            background: #2ecc71;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
        }

        /* ================= FORM CARD ================= */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 60px;
            height: 60px;
            background: #2ecc71;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2ecc71;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #27ae60;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            color: #2ecc71;
            text-decoration: none;
            font-weight: 600;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .nav-links a {
                display: none;
            }

            .nav-links .btn {
                display: inline-block;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <div class="navbar">
        <div class="logo">
            🚴 <span>Daily Drift</span>
        </div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Login</a>
            <a href="#" class="btn">Sign Up</a>
        </div>
    </div>

    <!-- ================= SIGN UP FORM ================= -->
    <div class="container">
        <div class="card">
            <div class="icon">🚲</div>
            <h2>Join Daily Drift</h2>
            <p class="subtitle">Create your account to get started</p>

            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Full Name">
                    <div class="error" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Email">
                    <div class="error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Phone number">
                    <div class="error" id="phoneError"></div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Password">
                    <div class="error" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password">
                    <div class="error" id="confirmPasswordError"></div>
                </div>

                <button type="submit">Create Account</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="#">Login</a>
            </div>
        </div>
    </div>

    <!-- ================= VALIDATION SCRIPT ================= -->
    <script>
        document.getElementById("signupForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let valid = true;

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            document.querySelectorAll(".error").forEach(el => el.textContent = "");

            if (name === "") {
                nameError.textContent = "Full name is required";
                valid = false;
            }

            if (!/^\S+@\S+\.\S+$/.test(email)) {
                emailError.textContent = "Enter a valid email";
                valid = false;
            }

            if (!/^\d{10}$/.test(phone)) {
                phoneError.textContent = "Enter a 10-digit phone number";
                valid = false;
            }

            if (password.length < 6) {
                passwordError.textContent = "Password must be at least 6 characters";
                valid = false;
            }

            if (password !== confirmPassword) {
                confirmPasswordError.textContent = "Passwords do not match";
                valid = false;
            }

            if (valid) {
                alert("Account created successfully!");
                this.reset();
            }
        });
    </script>

</body>

</html>
