<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ride – Daily Drift</title>

    <style>
        :root {
            --green: #28b463;
            --light-bg: #f6ffe8;
            --card-bg: #ffffff;
            --text-dark: #1e1e1e;
            --border: #dcdcdc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(to bottom, #f4ffe6, #fffbe6);
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            background: transparent;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 600;
            color: var(--green);
        }

        .logo span {
            background: var(--green);
            color: white;
            padding: 6px 8px;
            border-radius: 50%;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        nav a {
            text-decoration: none;
            color: #444;
            font-size: 15px;
        }

        nav a.active {
            background: #e9f8ef;
            color: var(--green);
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f2fbe9;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* ===== PAGE CONTENT ===== */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            color: var(--text-dark);
        }

        .page-header p {
            color: #555;
            margin-top: 6px;
        }

        .switch-btn {
            border: 2px solid #f1c40f;
            background: transparent;
            color: #b7950b;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* ===== CARD ===== */
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--green);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* ===== BUTTONS ===== */
        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .btn-cancel {
            flex: 1;
            background: #fff;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-create {
            flex: 1;
            background: var(--green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* ===== NOTE ===== */
        .note {
            margin-top: 20px;
            background: #fff9db;
            border: 1px solid #f1e4a3;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            color: #555;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            nav {
                display: none;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <span>🚴</span> Daily Drift
        </div>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Find Rides</a>
            <a href="#" class="active">Create Ride</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <div class="profile">
            👤 Yash Bhesaniya
        </div>
    </header>

    <div class="container">

        <div class="page-header">
            <div>
                <h1>Ride Creator</h1>
                <p>Share your journey and help others reach their destination</p>
            </div>
            <button class="switch-btn">🔍 Switch to Ride Seeker</button>
        </div>

        <div class="card">
            <div class="form-group">
                <label>Starting Point</label>
                <input type="text" placeholder="Enter starting location">
            </div>

            <div class="form-group">
                <label>Destination</label>
                <input type="text" placeholder="Enter destination">
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>Time</label>
                    <input type="time">
                </div>
            </div>

            <div class="form-group">
                <label>Available Seats</label>
                <input type="number" placeholder="Number of seats">
            </div>

            <div class="actions">
                <button class="btn-cancel">Cancel</button>
                <button class="btn-create">Create Ride</button>
            </div>
        </div>

        <div class="note">
            <strong>Note:</strong> Make sure to provide accurate information.
            Riders will contact you using the phone number from your profile.
        </div>

    </div>

</body>

</html>
