<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Drift - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(to right, #f4fde8, #fff6d9);
        }

        /* ===== HEADER ===== */
        header {
            background: #fff;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #2ecc71;
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            background: #2ecc71;
            color: #fff;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 18px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        nav .signup {
            background: #2ecc71;
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px;
        }

        /* ===== MAIN ===== */
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 20px;
        }

        .login-card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .login-icon {
            background: #2ecc71;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 20px;
        }

        .login-card h2 {
            margin-bottom: 5px;
        }

        .login-card p {
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 14px;
            margin-bottom: 6px;
            display: block;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #2ecc71;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        .login-btn {
            width: 100%;
            background: #2ecc71;
            border: none;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #27ae60;
        }

        .signup-text {
            margin-top: 20px;
            font-size: 14px;
        }

        .signup-text a {
            color: #2ecc71;
            text-decoration: none;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            nav a:not(.signup) {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <span>🚲</span>
            Daily Drift
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Login</a>
            <a href="#" class="signup">Sign Up</a>
        </nav>
    </header>

    <main class="container">
        <div class="login-card">
            <div class="login-icon">🚲</div>
            <h2>Welcome Back</h2>
            <p>Login to continue your journey</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" id="email" placeholder="your@email.com">
                    <small class="error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••">
                    <small class="error" id="passwordError"></small>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="signup-text">
                Don't have an account? <a href="#">Sign Up</a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();

            let emailError = document.getElementById("emailError");
            let passwordError = document.getElementById("passwordError");

            emailError.textContent = "";
            passwordError.textContent = "";

            let isValid = true;

            // Email validation
            if (email === "") {
                emailError.textContent = "Email is required";
                isValid = false;
            } else if (!validateEmail(email)) {
                emailError.textContent = "Enter a valid email address";
                isValid = false;
            }

            // Password validation
            if (password === "") {
                passwordError.textContent = "Password is required";
                isValid = false;
            } else if (password.length < 6) {
                passwordError.textContent = "Password must be at least 6 characters";
                isValid = false;
            }

            if (isValid) {
                alert("Login successful ✅");
                // document.getElementById("loginForm").submit(); // enable when backend exists
            }
        });

        function validateEmail(email) {
            const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return pattern.test(email);
        }
    </script>

</body>

</html>
